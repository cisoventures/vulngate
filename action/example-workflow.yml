# Copy this to .github/workflows/vulngate.yml in your repo.
name: vulngate
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write     # upsert the single PR comment
  security-events: write   # upload SARIF to the Security tab

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned by commit, not by tag: a moving tag can change what runs without a diff.
      # Add .github/dependabot.yml (github-actions, weekly) and updates arrive as PRs.
      - uses: cisoventures/vulngate@b6a322b92b494341a9d702e2c8e91856a9096412  # v1.5.5
        with:
          fail-on: high
          # diff-only: true                                  # only fail on files this PR touched
          # anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: your key → LLM triage + fix suggestions
